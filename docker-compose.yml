# Optional: run both databases without installing anything.   docker compose up -d
services:
  mysql:
    image: mysql:8.4
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: skydesk
    ports: ["3306:3306"]
    volumes: ["mysqldata:/var/lib/mysql"]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongodata:/data/db"]
volumes:
  mysqldata:
  mongodata:
